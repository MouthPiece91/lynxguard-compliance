[project]
name = "lynxguard"
version = "0.1.0"
description = "LynxGuard: rule-based compliance checks for regulated trading, starting with US retail forex."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lynxguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
